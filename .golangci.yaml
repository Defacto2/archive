version: '2'
linters:
  default: all
  disable:
    - nonamedreturns
    - depguard
    - gomodguard
    - nlreturn
    - noinlineerr
    - paralleltest
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 15
    misspell:
      locale: US
    nonamedreturns:
      report-error-in-defer: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters:
          - goconst
        path: _test\.go$

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
